# darkhos/jlpt-n3 의 GitHub Pages 배포 (npm run deploy:jlpt 가 out/.github/workflows/pages.yml 로 함께 올린다).
# 예전 방식(legacy)은 GitHub 이 Jekyll 로 8천 개 넘는 파일을 다시 처리해서 10분 제한에 걸려 실패하곤 했다.
# 이 방식은 이미 만들어진 파일을 그대로 묶어 올리기만 한다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # deploy:jlpt 는 프로젝트 전체를 빌드하므로 ONDO 의 다른 페이지·엑셀 파일까지 따라온다.
      # JLPT 사이트에 필요한 것만 남긴다 (한글 이름 파일이 Pages 배포를 막기도 한다).
      - name: Keep only the JLPT site
        run: |
          shopt -s dotglob
          for f in *; do
            case "$f" in
              .git|.github|.nojekyll|404.html|404|__next.*|index.html|index.txt|_next|_not-found|jlpt-n3|n3|favicon.ico|audio|data) ;;
              *) rm -rf -- "$f" ;;
            esac
          done
          find data -mindepth 1 -maxdepth 1 ! -name jlpt-n3 -exec rm -rf {} +
          find audio -mindepth 1 -maxdepth 1 ! -name jlpt-n3 -exec rm -rf {} +
          echo "files: $(find . -type f -not -path './.git/*' -not -path './.github/*' | wc -l)"
          du -sh --exclude=.git .
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
