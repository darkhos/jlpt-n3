# darkhos/jlpt-n3 의 GitHub Pages 배포 (npm run deploy:jlpt 가 out/.github/workflows/pages.yml 로 함께 올린다).
# 예전 방식(legacy)은 GitHub 이 Jekyll 로 8천 개 넘는 파일을 다시 처리해서 10분 제한에 걸려 실패하곤 했다.
# 이 방식은 이미 만들어진 파일을 그대로 묶어 올리기만 한다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
