# darkhos/jlpt-n3 의 GitHub Pages 배포 (npm run deploy:jlpt 가 out/.github/workflows/pages.yml 로 함께 올린다).
#
# 왜 이 방식인가
# - 예전 방식(legacy)은 GitHub 이 Jekyll 로 8천 개 넘는 파일을 다시 처리해서 10분 제한에 걸려 실패하곤 했다.
# - 저장소 폴더(.)를 그대로 올리면 Pages 배포가 "try again later" 로 곧바로 실패했다 (2026-11-07 확인).
#   필요한 파일만 새 폴더(_site)에 복사해 올리면 같은 파일 8,584개도 성공한다.
# - deploy:jlpt 는 프로젝트 전체를 빌드하므로 ONDO 의 다른 페이지·엑셀 파일까지 따라온다. JLPT 에 필요한 것만 남긴다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Copy only the JLPT site
        run: |
          mkdir -p "$RUNNER_TEMP/_site"
          for k in .nojekyll index.html index.txt 404.html 404 __next.__PAGE__.txt __next._full.txt __next._tree.txt \
                   _next _not-found jlpt-n3 n3 wrong-notes favicon.ico data/jlpt-n3 audio/jlpt-n3; do
            [ -e "$k" ] || continue
            mkdir -p "$RUNNER_TEMP/_site/$(dirname "$k")"
            cp -R "$k" "$RUNNER_TEMP/_site/$k"
          done
          echo "files: $(find "$RUNNER_TEMP/_site" -type f | wc -l)"
          du -sh "$RUNNER_TEMP/_site"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/_site
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # GitHub 쪽 파일 옮기기(syncing_files)는 정상이면 1분 안에 끝나고, 멈추면 끝까지 멈춰 있다
          # (10분을 기다려도 실패, 2026-11-10 세 번 확인). 3분에 끊고, 올린 쪽(scripts/jlpt-deploy-watch.sh)이
          # 새 커밋으로 다시 올리게 한다. 같은 커밋으로 다시 돌리면 계속 실패했다.
          timeout: 180000
