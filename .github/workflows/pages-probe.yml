name: Pages probe
on:
  workflow_dispatch:
    inputs:
      keep:
        description: "space separated paths to keep (or ONE for a single test file)"
        required: true
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Build probe folder
        run: |
          mkdir -p /tmp/site
          if [ "${{ inputs.keep }}" = "ONE" ]; then echo '<!doctype html><title>probe</title>ok' > /tmp/site/index.html; else for k in ${{ inputs.keep }}; do mkdir -p "/tmp/site/$(dirname "$k")"; cp -R "$k" "/tmp/site/$k"; done; fi
          echo "files: $(find /tmp/site -type f | wc -l)"; find /tmp/site -type l | head
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/site
      - uses: actions/deploy-pages@v4
